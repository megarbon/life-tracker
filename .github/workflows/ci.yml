name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Formato, análisis estático y lint
        run: ./gradlew spotlessCheck detekt lintDebug

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest :core:model:test

      - name: Compilar APK debug
        run: ./gradlew assembleDebug

      - name: Compilar y analizar release (R8 y lint)
        run: ./gradlew assembleRelease lintRelease

      - name: Comprobar que los datos de demo no entran en release
        run: |
          if ./gradlew :app:dependencies --configuration releaseRuntimeClasspath | grep -q "core:demo"; then
            echo "core:demo no debe estar en el classpath de release"
            exit 1
          fi

      - name: Subir informes si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
